[package]
name = "openvcs"
version = "0.3.0"
description = "OpenVCS: a lightweight, highly customizable Git GUI built on Rust & Tauri"
authors = ["Jordon Brooks"]
homepage = "https://bbgames.dev"
repository = "https://github.com/Jordonbc/OpenVCS"
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openvcs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2.4", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[features]
default = []

[dependencies]
dotenvy = "0.15"
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
notify = "8"
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"
tokio = { version = "1.51", features = ["io-util", "process", "rt", "sync", "time"] }
dirs = "6"
regex = "1.12"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
sentry = { version = "0.47", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "log", "logs"] }
sentry-log = { version = "0.47", features = ["logs"] }
toml = "1.0.6"
directories = "6"
serde_json = "1.0"
time = { version = "0.3", features = ["local-offset"] }
zip = "8.6"
tar = "0.4"
flate2 = "1"
shlex = "1.2"
sha2 = "0.11"
hex = "0.4"
os_pipe = "1.2"
base64 = "0.22"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
