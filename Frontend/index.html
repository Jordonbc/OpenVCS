<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenVCS</title>
  <link rel="stylesheet" href="src/styles/index.css" />
  <script type="module" src="src/scripts/main.ts" defer></script>
</head>
<body>
  <div class="app" id="app">
    <nav class="menubar" role="menubar" aria-label="Application menu">
      <div class="menu" data-menu="file">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">File</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" type="button" role="menuitem" data-action="clone_repo">Clone…</button>
          <button class="menu-item" type="button" role="menuitem" data-action="add_repo">Add Existing…</button>
          <button class="menu-item" type="button" role="menuitem" data-action="open_repo">Switch…</button>
          <div class="menu-sep" aria-hidden="true"></div>
          <button class="menu-item" type="button" role="menuitem" data-action="settings">Preferences…</button>
          <button class="menu-item" type="button" role="menuitem" data-action="exit">Exit</button>
        </div>
      </div>
      <div class="menu" data-menu="repository">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Repository</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" type="button" role="menuitem" data-action="fetch">Fetch/Pull</button>
          <button class="menu-item" type="button" role="menuitem" data-action="push">Push</button>
          <button class="menu-item" type="button" role="menuitem" data-action="commit">Commit</button>
          <div class="menu-sep" aria-hidden="true"></div>
          <button class="menu-item" type="button" role="menuitem" data-action="repo-edit-gitignore">Edit .gitignore</button>
          <button class="menu-item" type="button" role="menuitem" data-action="repo-edit-gitattributes">Edit .gitattributes</button>
          <button class="menu-item" type="button" role="menuitem" data-action="repo-settings">Repository Settings</button>
        </div>
      </div>
      <div class="menu" data-menu="help">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Help</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" type="button" role="menuitem" data-action="docs">Documentation</button>
          <button class="menu-item" type="button" role="menuitem" data-action="show-output-log">Show Output Log</button>
          <button class="menu-item" type="button" role="menuitem" data-action="check_updates">Check for Updates…</button>
          <button class="menu-item" type="button" role="menuitem" data-action="about">About</button>
        </div>
      </div>
    </nav>

    <!-- Titlebar -->
    <header class="titlebar" role="banner">
      <div class="repo-switch" id="repo-switch" title="Switch repository (Ctrl+R)" role="button" tabindex="0" aria-haspopup="dialog">
        <div class="repo-meta">
          <div class="repo-title" id="repo-title">Click to open Repo</div>
          <div class="repo-branch" id="repo-branch">No repo open</div>
        </div>
        <span class="chev" aria-hidden="true">▾</span>
      </div>

      <button class="branch-switch" id="branch-switch" type="button" title="Switch branch" aria-haspopup="listbox" aria-expanded="false">
        <span class="branch-dot" aria-hidden="true"></span>
        <span id="branch-name">No repo open</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>

      <div class="title-actions">
        <div class="split-btn" id="fetch-split" role="group" aria-label="Fetch and pull">
        <button class="btn" id="fetch-btn" type="button" title="Fetch (F5)">Fetch</button>
        <button class="btn split-caret" id="fetch-caret" type="button" title="Fetch options" aria-haspopup="menu" aria-expanded="false" aria-label="Fetch options">▾</button>
        </div>
          <button class="btn with-badge" id="push-btn" type="button" title="Push">
          <span class="btn-label">Push</span>
        </button>
        <div id="plugin-title-actions" class="plugin-title-actions" aria-label="Plugin actions"></div>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs" role="tablist" aria-label="Primary views">
          <button class="tab active" data-tab="changes" type="button" role="tab" aria-selected="true" id="tab-changes">Changes</button>
          <button class="tab" data-tab="history" type="button" role="tab" aria-selected="false" id="tab-history">History</button>
      <span class="badge" id="ahead-behind" title="Divergence with upstream" aria-live="polite" hidden></span>
          <button class="tab" data-tab="stash" type="button" role="tab" aria-selected="false" id="tab-stash">Stash</button>
    </nav>

    <!-- Work area -->
    <section class="work" aria-label="Workspace">
      <!-- Left column -->
      <aside class="panel left" id="left" aria-label="List panel">
        <div class="left-head">
          <div class="filter">
            <label class="select-all" title="Select all visible files">
              <input id="select-all" type="checkbox" aria-label="Select all visible files" />
              <span>All</span>
            </label>
            <span class="filter-icon" aria-hidden="true">🔎</span>
            <input id="filter" type="search" placeholder="Filter files… (Ctrl+F)" aria-label="Filter files or commits" />
          </div>
          <span id="changes-count">0 items</span>
        </div>
        <div class="list-scroll" aria-label="Items scroll area">
          <ul class="list" id="file-list" role="listbox" aria-label="Items"></ul>
        </div>
        <div class="left-foot" id="left-foot">
          <button class="btn" id="undo-left-btn" type="button" title="Undo last unpushed commit">Undo last commit</button>
        </div>
      </aside>

      <!-- Resizer -->
      <div class="resizer" id="resizer" title="Resize panel" aria-hidden="true"></div>

      <!-- Right column -->
	      <main class="panel right" id="right" role="main">
	        <div class="diff-head">
	          <div class="path" id="diff-path">Select an item</div>
	          <div class="meta" id="diff-meta" aria-label="Selected file metadata">
	            <span id="diff-line-ending">—</span>
	            <span id="diff-encoding">—</span>
	            <span id="diff-bom" hidden>BOM</span>
	          </div>
	        </div>

        <div class="diff diff-scroll" aria-label="Diff scroll area">
          <div class="diff-content" id="diff" aria-live="polite" aria-label="Diff view"></div>
        </div>

        <!-- Commit panel (hidden on History tab via JS) -->
        <section class="commit" id="commit" aria-label="Commit changes">
          <div class="inputs">
            <input id="commit-summary" placeholder="Summary (required)" aria-label="Commit summary" />
            <textarea id="commit-desc" placeholder="Description (optional)" aria-label="Commit description"></textarea>
          </div>
          <div class="actions">
                <button class="btn primary" id="commit-btn" type="button" disabled>Commit</button>
          </div>
        </section>
      </main>
    </section>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <div class="hints">
        Shortcuts: <span class="kbd">Ctrl+R</span> repo ·
        <span class="kbd">Ctrl+F</span> filter ·
        <span class="kbd">Ctrl+Enter</span> commit ·
        <span class="kbd">F5</span> fetch/pull
      </div>
      <div id="status" aria-live="polite">Ready</div>
    </footer>
  </div>
  
  <!-- Branch popover -->
  <div class="popover" id="branch-pop" role="dialog" aria-modal="false" aria-label="Branches" hidden>
    <div class="pop-head">
      <input id="branch-filter" type="search" placeholder="Find or create branch…" aria-label="Filter branches">
      <button class="pick" id="branch-new" type="button">New…</button>
    </div>
    <div class="pop-list-scroll" aria-label="Branch list scroll area">
      <ul class="pop-list" id="branch-list" role="listbox" aria-label="Branch list"></ul>
    </div>
  </div>

  <!-- Fetch popover -->
  <div class="popover compact" id="fetch-pop" role="menu" aria-label="Fetch options" hidden>
    <div class="pop-list-scroll" aria-label="Fetch options scroll area">
      <ul class="pop-list" id="fetch-list" role="menu">
        <li role="menuitem" tabindex="0" data-action="fetch-only">
          <span class="label"><span class="name">Fetch</span></span>
        </li>
        <li role="menuitem" tabindex="0" data-action="fetch-all">
          <span class="label"><span class="name">Fetch all remotes</span></span>
        </li>
        <li role="menuitem" tabindex="-1" data-action="pull" aria-disabled="true">
          <span class="label"><span class="name">Pull</span></span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Modal mount -->
  <div id="modals-root"></div>

</body>
</html>
