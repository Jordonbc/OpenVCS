<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenVCS</title>
  <link rel="stylesheet" href="src/styles/index.css" />
  <script type="module" src="src/scripts/main.ts" defer></script>
</head>
<body>
  <div class="app" id="app">
    <nav class="menubar" role="menubar" aria-label="Application menu">
      <div class="menu" data-menu="file">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">File</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" data-action="clone_repo">Clone…</button>
          <button class="menu-item" role="menuitem" data-action="add_repo">Add Existing…</button>
          <button class="menu-item" role="menuitem" data-action="open_repo">Switch…</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item" role="menuitem" data-action="settings">Preferences…</button>
          <button class="menu-item" role="menuitem" data-action="exit">Exit</button>
        </div>
      </div>
      <div class="menu" data-menu="repository">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Repository</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" data-action="fetch">Fetch/Pull</button>
          <button class="menu-item" role="menuitem" data-action="push">Push</button>
          <button class="menu-item" role="menuitem" data-action="commit">Commit</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item" role="menuitem" data-action="repo-edit-gitignore">Edit .gitignore</button>
          <button class="menu-item" role="menuitem" data-action="repo-edit-gitattributes">Edit .gitattributes</button>
          <button class="menu-item" role="menuitem" data-action="repo-settings">Repository Settings</button>
        </div>
      </div>
      <div class="menu" data-menu="lfs">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">LFS</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" data-action="lfs-pull-all">Download LFS Files</button>
          <button class="menu-item" role="menuitem" data-action="lfs-fetch-all">Fetch LFS</button>
          <button class="menu-item" role="menuitem" data-action="lfs-prune">Prune LFS Cache</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item" role="menuitem" data-action="lfs-settings">LFS Preferences…</button>
        </div>
      </div>
      <div class="menu" data-menu="help">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Help</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" data-action="docs">Documentation</button>
          <button class="menu-item" role="menuitem" data-action="check_updates">Check for Updates…</button>
          <button class="menu-item" role="menuitem" data-action="about">About</button>
        </div>
      </div>
    </nav>

    <!-- Titlebar -->
    <header class="titlebar" role="banner">
      <div class="repo-switch" id="repo-switch" title="Switch repository (Ctrl+R)" role="button" tabindex="0" aria-haspopup="dialog">
        <div class="repo-meta">
          <div class="repo-title" id="repo-title">Click to open Repo</div>
          <div class="repo-branch" id="repo-branch">No repo open</div>
        </div>
        <span class="chev" aria-hidden="true">▾</span>
      </div>

      <button class="branch-switch" id="branch-switch" title="Switch branch" aria-haspopup="listbox" aria-expanded="false">
        <span class="branch-dot" aria-hidden="true"></span>
        <span id="branch-name">No repo open</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>

      <div class="title-actions">
        <button class="btn" id="fetch-btn" title="Fetch/Pull (F5)">Fetch/Pull</button>
        <button class="btn with-badge" id="push-btn" title="Push">
          <span class="btn-label">Push</span>
        </button>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs" role="tablist" aria-label="Primary views">
      <button class="tab active" data-tab="changes" role="tab" aria-selected="true" id="tab-changes">Changes</button>
      <button class="tab" data-tab="history" role="tab" aria-selected="false" id="tab-history">History</button>
      <span class="badge" id="ahead-behind" title="Divergence with upstream" aria-live="polite" hidden></span>
      <button class="tab" data-tab="stash" role="tab" aria-selected="false" id="tab-stash">Stash</button>
    </nav>

    <!-- Work area -->
    <section class="work" aria-label="Workspace">
      <!-- Left column -->
      <aside class="panel left" id="left" aria-label="List panel">
        <div class="left-head">
          <div class="filter">
            <label class="select-all" title="Select all visible files">
              <input id="select-all" type="checkbox" aria-label="Select all visible files" />
              <span>All</span>
            </label>
            <span class="filter-icon" aria-hidden="true">🔎</span>
            <input id="filter" type="search" placeholder="Filter files… (Ctrl+F)" aria-label="Filter files or commits" />
          </div>
          <span id="changes-count">0 items</span>
        </div>
        <ul class="list" id="file-list" role="listbox" aria-label="Items"></ul>
        <div class="left-foot" id="left-foot">
          <button class="btn" id="undo-left-btn" title="Undo last unpushed commit">Undo last commit</button>
        </div>
      </aside>

      <!-- Resizer -->
      <div class="resizer" id="resizer" title="Resize panel" aria-hidden="true"></div>

      <!-- Right column -->
      <main class="panel right" id="right" role="main">
        <div class="diff-head">
          <div class="path" id="diff-path">Select an item</div>
          <div class="meta" id="diff-meta" aria-label="Diff settings">
            <span>LF</span><span>UTF-8</span><span>Unified</span>
          </div>
        </div>

        <div class="diff" id="diff" aria-live="polite" aria-label="Diff view"></div>

        <!-- Commit panel (hidden on History tab via JS) -->
        <section class="commit" id="commit" aria-label="Commit changes">
          <div class="inputs">
            <input id="commit-summary" placeholder="Summary (required)" aria-label="Commit summary" />
            <textarea id="commit-desc" placeholder="Description (optional)" aria-label="Commit description"></textarea>
          </div>
          <div class="actions">
            <span class="kbd">Ctrl+Enter</span>
            <button class="btn primary" id="commit-btn" disabled>Commit</button>
          </div>
        </section>
      </main>
    </section>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <div class="hints">
        Shortcuts: <span class="kbd">Ctrl+R</span> repo ·
        <span class="kbd">Ctrl+F</span> filter ·
        <span class="kbd">Ctrl+Enter</span> commit ·
        <span class="kbd">F5</span> fetch/pull
      </div>
      <div id="status" aria-live="polite">Ready</div>
    </footer>
  </div>
  
  <!-- Branch popover -->
  <div class="popover" id="branch-pop" role="dialog" aria-modal="false" aria-label="Branches" hidden>
    <div class="pop-head">
      <input id="branch-filter" type="search" placeholder="Find or create branch…" aria-label="Filter branches">
      <button class="pick" id="branch-new" type="button">New…</button>
    </div>
    <ul class="pop-list" id="branch-list" role="listbox" aria-label="Branch list"></ul>
  </div>

  <!-- Modal mount -->
  <div id="modals-root"></div>

</body>
</html>
