<div class="modal" id="repo-settings-modal" aria-hidden="true">
    <div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="repo-settings-title">
        <div class="sheet-head">
            <h3 id="repo-settings-title" style="margin:0">Repository Settings</h3>
            <button class="icon close" type="button" data-close aria-label="Close">✕</button>
        </div>
        <div class="sheet-body">
            <form id="repo-settings-form" class="panel-form">
                <div class="group">
                    <label for="user-name">Name on commits</label>
                    <input id="user-name" type="text" />
                    <div class="help-text">Used only for this repository’s commits.</div>
                </div>
                <div class="group">
                    <label for="user-email">Email on commits</label>
                    <input id="user-email" type="text" inputmode="email" autocomplete="email" spellcheck="false" />
                    <div class="help-text">Used only for this repository’s commits.</div>
                </div>
                <div class="group">
                    <div class="field-label">Remotes</div>
                    <div id="remotes" class="remotes"></div>
                    <button class="tbtn" id="remote-add" type="button">Add Remote</button>
                </div>
            </form>
        </div>
        <div class="sheet-actions">
            <button class="tbtn" type="button" data-close>Cancel</button>
            <button class="tbtn primary big" id="repo-settings-save" type="button">Save</button>
        </div>
    </div>
    <div class="backdrop" data-close></div>
</div>
