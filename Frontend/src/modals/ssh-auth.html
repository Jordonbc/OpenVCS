<div class="modal" id="ssh-auth-modal" aria-hidden="true">
  <div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="ssh-auth-title">
    <div class="sheet-head">
      <h3 id="ssh-auth-title" style="margin:0">SSH Authentication Failed</h3>
    </div>
    <div class="sheet-body">
      <div class="panel-form">
        <div class="group">
          <div style="color:var(--muted); font-size:.95rem;">
            OpenVCS couldn’t authenticate to this remote over SSH. Ensure your SSH key is loaded (ssh-agent) or switch the remote to HTTPS.
          </div>
        </div>
        <div class="group">
          <label>Host</label>
          <div id="ssh-auth-host" style="font-family:var(--mono);"></div>
        </div>
        <div class="group">
          <label>Remote</label>
          <div id="ssh-auth-remote" style="font-family:var(--mono);"></div>
        </div>
        <div class="group">
          <label>URL</label>
          <div id="ssh-auth-url" style="font-family:var(--mono); word-break:break-all;"></div>
        </div>
        <details class="group">
          <summary style="cursor:pointer; color:var(--muted);">Details</summary>
          <pre id="ssh-auth-msg" style="white-space:pre-wrap; margin:.5rem 0 0; color:var(--muted);"></pre>
        </details>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="tbtn" id="ssh-auth-open-remotes" type="button">Open Remotes…</button>
      <button class="tbtn primary big" id="ssh-auth-ok" type="button">OK</button>
    </div>
  </div>
  <div class="backdrop" data-close></div>
</div>
