<!-- Cherry-pick commit modal -->
<div class="modal" id="cherry-pick-modal" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="cherry-pick-title">
    <div class="sheet-head">
      <h3 id="cherry-pick-title" style="margin:0">Cherry-pick commit</h3>
      <button class="tbtn" data-close aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <form class="panel-form" onsubmit="return false;">
        <div class="row">
          <label for="cherry-pick-commit">Commit</label>
          <input id="cherry-pick-commit" type="text" readonly />
        </div>
        <div class="row">
          <label for="cherry-pick-branch">Target branch</label>
          <select id="cherry-pick-branch"></select>
        </div>
      </form>
      <div style="color:var(--muted); font-size:.85rem; margin-top:.5rem;">
        Switches to the target branch and applies the commit on top of it.
      </div>
    </div>
    <div class="sheet-actions" style="display:flex; gap:.5rem; justify-content:flex-end;">
      <button class="tbtn" data-close type="button">Cancel</button>
      <button class="tbtn primary" id="cherry-pick-confirm" type="button" disabled>Cherry-pick</button>
    </div>
  </div>
</div>
