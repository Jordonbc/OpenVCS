<!-- Error dialog modal -->
<div class="modal" id="error-modal" aria-hidden="true">
  <div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="error-modal-title">
    <div class="sheet-head">
      <h3 id="error-modal-title" style="margin:0">Error</h3>
      <button class="tbtn" id="error-modal-dismiss" data-close type="button" aria-label="Close">✕</button>
    </div>

    <div class="sheet-body">
      <div class="modal-note" id="error-modal-message"></div>
    </div>

    <div class="sheet-actions">
      <button class="tbtn primary big" id="error-modal-ok" data-close type="button">OK</button>
    </div>
  </div>
  <div class="backdrop" data-close></div>
</div>
