name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor == 'Jordonbc'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Pinned to an immutable commit for CodeQL (tag: github-v1.2.17)
      - uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee
        env:
          OPENAI_API_KEY: ${{ secrets.ZEN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_REVIEW_MODEL }}
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
