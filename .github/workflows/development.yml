name: Dev CI (fast)

on:
  push:
    branches: [ Dev ]
    paths:
      - 'openvcs.plugins.json'
      - 'Frontend/**'
      - 'Backend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/development.yml'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    branches: [ Dev ]
    paths:
      - 'openvcs.plugins.json'
      - 'Frontend/**'
      - 'Backend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/development.yml'
      - '!docs/**'
      - '!**/*.md'

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ vars.SSCCACHE_GHA_ENABLED }}
      SCCACHE_CACHE_SIZE: ${{ vars.SSCCACHE_SIZE }}
      OPENVCS_UPDATE_CHANNEL: dev
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Dev CI doesn't need LFS assets; skipping saves bandwidth and disk.
          lfs: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          # GitHub-hosted runners come with large preinstalled SDKs we don't need.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* || true
          df -h

      # ---------- Frontend: lint + typecheck ----------
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: Frontend
        run: npm run lint --if-present

      - name: Typecheck
        working-directory: Frontend
        run: npm run typecheck --if-present

      # ---------- Backend: cargo check ----------
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev
          pkg-config --modversion javascriptcoregtk-4.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
        continue-on-error: true

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check

      - name: Install `just`
        run: |
          # Install `just` via cargo so it's available on the runner
          cargo install --locked just || true

      - name: Run `just test`
        run: |
          just --version || true
          just test

      - name: Cleanup heavy dirs (before post-job cache save)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          du -hs Frontend/node_modules || true
          rm -rf Frontend/node_modules || true
          df -h
